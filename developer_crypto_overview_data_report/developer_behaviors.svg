<svg width="100%" viewBox="0 0 680 320" role="img" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Platform A -->
  <rect x="60" y="60" width="220" height="200" rx="8" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="6 3"/>
  <text font-family="sans-serif" font-size="14" font-weight="500" x="170" y="88" text-anchor="middle" fill="#2C2C2A">Platform A</text>

  <!-- Platform B -->
  <rect x="400" y="60" width="220" height="200" rx="8" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="6 3"/>
  <text font-family="sans-serif" font-size="14" font-weight="500" x="510" y="88" text-anchor="middle" fill="#2C2C2A">Platform B</text>

  <!-- Adoption -->
  <circle cx="30" cy="140" r="7" fill="#378ADD"/>
  <line x1="38" y1="140" x2="90" y2="140" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrow)"/>
  <circle cx="130" cy="140" r="7" fill="#378ADD"/>
  <circle cx="160" cy="160" r="7" fill="#378ADD"/>
  <circle cx="150" cy="120" r="7" fill="#378ADD"/>
  <text font-family="sans-serif" font-size="12" x="170" y="220" text-anchor="middle" fill="#378ADD">① Adoption</text>

  <!-- Migration -->
  <circle cx="240" cy="200" r="7" fill="#D85A30"/>
  <line x1="248" y1="200" x2="398" y2="200" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <circle cx="440" cy="200" r="7" fill="#D85A30"/>
  <text font-family="sans-serif" font-size="12" x="323" y="240" text-anchor="middle" fill="#D85A30">② Migration</text>

  <!-- Multi-homing -->
  <circle cx="200" cy="130" r="7" fill="#7F77DD"/>
  <path d="M207 130 Q340 100 453 130" fill="none" stroke="#7F77DD" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <circle cx="460" cy="130" r="7" fill="#7F77DD"/>
  <text font-family="sans-serif" font-size="12" x="340" y="108" text-anchor="middle" fill="#7F77DD">③ Multi-homing</text>

  <!-- Legend -->
  <circle cx="60" cy="295" r="5" fill="#378ADD"/>
  <text font-family="sans-serif" font-size="12" x="72" y="299" fill="#2C2C2A">Adoption</text>
  <circle cx="190" cy="295" r="5" fill="#D85A30"/>
  <text font-family="sans-serif" font-size="12" x="202" y="299" fill="#2C2C2A">Migration</text>
  <circle cx="320" cy="295" r="5" fill="#7F77DD"/>
  <text font-family="sans-serif" font-size="12" x="332" y="299" fill="#2C2C2A">Multi-homing</text>
</svg>